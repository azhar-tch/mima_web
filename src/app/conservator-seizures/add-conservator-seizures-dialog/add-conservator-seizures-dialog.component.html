<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une saisie conservatoire</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez une nouvelle saisie</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro de saisie -->
      <div class="grid gap-2">
        <label for="seizureNumber" class="text-sm font-medium text-gray-700">Numéro de saisie *</label>
        <input
          id="seizureNumber"
          type="text"
          placeholder="Ex: SEZ-2024-001"
          [(ngModel)]="formData.seizureNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['seizureNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['seizureNumber']" class="text-red-500 text-sm">{{ errors['seizureNumber'] }}</p>
      </div>

      <!-- Date et heure -->
      <div class="grid gap-2">
        <label for="dateTime" class="text-sm font-medium text-gray-700">Date et heure *</label>
        <input
          id="dateTime"
          type="datetime-local"
          placeholder=""
          [(ngModel)]="formData.dateTime"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['dateTime'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['dateTime']" class="text-red-500 text-sm">{{ errors['dateTime'] }}</p>
      </div>

      <!-- Localisation -->
      <div class="grid gap-2">
        <label for="location" class="text-sm font-medium text-gray-700">Localisation *</label>
        <input
          id="location"
          type="text"
          placeholder=""
          [(ngModel)]="formData.location"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['location'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['location']" class="text-red-500 text-sm">{{ errors['location'] }}</p>
      </div>

      <!-- Description de la saisie -->
      <div class="grid gap-2">
        <label for="seizureDescription" class="text-sm font-medium text-gray-700">Description de la saisie *</label>
        <textarea
          id="seizureDescription"
          placeholder=""
          [(ngModel)]="formData.seizureDescription"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['seizureDescription'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['seizureDescription']" class="text-red-500 text-sm">{{ errors['seizureDescription'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
