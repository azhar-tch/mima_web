<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une saisie conservatoire</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez une nouvelle saisie</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Basic Information -->
      <div class="col-span-2 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de base</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Navire commercial -->
        <div class="grid gap-2">
          <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">Navire commercial *</label>
          <select
            id="commercialShipTrackingId"
            [(ngModel)]="formData.commercialShipTrackingId"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['commercialShipTrackingId'] ? 'border-red-500' : 'border-gray-300')">
            <option value="">Sélectionner un navire</option>
            <option *ngFor="let ship of commercialShips" [value]="ship.trackingId">
              {{ ship.shipName }} ({{ ship.imoNumber }})
            </option>
          </select>
          <p *ngIf="errors['commercialShipTrackingId']" class="text-red-500 text-sm">{{ errors['commercialShipTrackingId'] }}</p>
        </div>

        <!-- Date de saisie -->
        <div class="grid gap-2">
          <label for="seizureDate" class="text-sm font-medium text-gray-700">Date de saisie *</label>
          <input
            id="seizureDate"
            type="date"
            placeholder=""
            [(ngModel)]="formData.seizureDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['seizureDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['seizureDate']" class="text-red-500 text-sm">{{ errors['seizureDate'] }}</p>
        </div>

        <!-- Type de saisie -->
        <div class="grid gap-2">
          <label for="seizureType" class="text-sm font-medium text-gray-700">Type de saisie</label>
          <input
            id="seizureType"
            type="text"
            placeholder="Ex: Conservatoire, Exécutoire"
            [(ngModel)]="formData.seizureType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Localisation de saisie -->
        <div class="grid gap-2">
          <label for="seizureLocation" class="text-sm font-medium text-gray-700">Localisation de saisie</label>
          <input
            id="seizureLocation"
            type="text"
            placeholder="Ex: Port de Cotonou"
            [(ngModel)]="formData.seizureLocation"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Statut -->
        <div class="grid gap-2">
          <label for="status" class="text-sm font-medium text-gray-700">Statut</label>
          <input
            id="status"
            type="text"
            placeholder="Ex: En cours, Levée"
            [(ngModel)]="formData.status"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Seizure Authority Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Autorité saisissante</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Autorité saisissante -->
        <div class="grid gap-2">
          <label for="seizingAuthority" class="text-sm font-medium text-gray-700">Autorité saisissante</label>
          <input
            id="seizingAuthority"
            type="text"
            placeholder="Ex: Tribunal de Commerce"
            [(ngModel)]="formData.seizingAuthority"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Numéro d'ordonnance de saisie -->
        <div class="grid gap-2">
          <label for="seizureOrderNumber" class="text-sm font-medium text-gray-700">Numéro d'ordonnance</label>
          <input
            id="seizureOrderNumber"
            type="text"
            placeholder="Numéro de l'ordonnance de saisie"
            [(ngModel)]="formData.seizureOrderNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Raison de la saisie -->
        <div class="grid gap-2 col-span-2">
          <label for="seizureReason" class="text-sm font-medium text-gray-700">Raison de la saisie</label>
          <textarea
            id="seizureReason"
            placeholder="Décrire la raison de la saisie"
            [(ngModel)]="formData.seizureReason"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="2"
          ></textarea>
        </div>
      </div>

      <!-- Financial Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations financières</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Montant de la créance -->
        <div class="grid gap-2">
          <label for="claimAmount" class="text-sm font-medium text-gray-700">Montant de la créance</label>
          <input
            id="claimAmount"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.claimAmount"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Montant payé -->
        <div class="grid gap-2">
          <label for="amountPaid" class="text-sm font-medium text-gray-700">Montant payé</label>
          <input
            id="amountPaid"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.amountPaid"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Parties Involved -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Parties impliquées</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Nom du créancier -->
        <div class="grid gap-2">
          <label for="creditorName" class="text-sm font-medium text-gray-700">Nom du créancier</label>
          <input
            id="creditorName"
            type="text"
            placeholder="Nom du créancier"
            [(ngModel)]="formData.creditorName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Représentant légal du créancier -->
        <div class="grid gap-2">
          <label for="creditorLegalRepresentative" class="text-sm font-medium text-gray-700">Représentant légal</label>
          <input
            id="creditorLegalRepresentative"
            type="text"
            placeholder="Nom du représentant légal"
            [(ngModel)]="formData.creditorLegalRepresentative"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Nom de l'huissier -->
        <div class="grid gap-2">
          <label for="bailiffName" class="text-sm font-medium text-gray-700">Nom de l'huissier</label>
          <input
            id="bailiffName"
            type="text"
            placeholder="Nom de l'huissier"
            [(ngModel)]="formData.bailiffName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Gardien du navire -->
        <div class="grid gap-2">
          <label for="shipGuardian" class="text-sm font-medium text-gray-700">Gardien du navire</label>
          <input
            id="shipGuardian"
            type="text"
            placeholder="Nom du gardien du navire"
            [(ngModel)]="formData.shipGuardian"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Release Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de levée</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Date de levée -->
        <div class="grid gap-2">
          <label for="releaseDate" class="text-sm font-medium text-gray-700">Date de levée</label>
          <input
            id="releaseDate"
            type="date"
            [(ngModel)]="formData.releaseDate"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Numéro d'ordonnance de levée -->
        <div class="grid gap-2">
          <label for="releaseOrderNumber" class="text-sm font-medium text-gray-700">Numéro d'ordonnance de levée</label>
          <input
            id="releaseOrderNumber"
            type="text"
            placeholder="Numéro de l'ordonnance de levée"
            [(ngModel)]="formData.releaseOrderNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Raison de la levée -->
        <div class="grid gap-2 col-span-2">
          <label for="releaseReason" class="text-sm font-medium text-gray-700">Raison de la levée</label>
          <textarea
            id="releaseReason"
            placeholder="Décrire la raison de la levée de saisie"
            [(ngModel)]="formData.releaseReason"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="2"
          ></textarea>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations complémentaires</h3>
      </div>

      <!-- Documents liés -->
      <div class="grid gap-2">
        <label for="relatedDocuments" class="text-sm font-medium text-gray-700">Documents liés</label>
        <textarea
          id="relatedDocuments"
          placeholder="Liste des documents liés à la saisie"
          [(ngModel)]="formData.relatedDocuments"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
