<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une agence de sécurité</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez une nouvelle agence de sécurité</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Basic Information -->
      <div class="col-span-2 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de base</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Numéro d'agence -->
        <div class="grid gap-2">
          <label for="agencyNumber" class="text-sm font-medium text-gray-700">Numéro d'agence *</label>
          <input
            id="agencyNumber"
            type="text"
            placeholder="Ex: AG-001"
            [(ngModel)]="formData.agencyNumber"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['agencyNumber'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['agencyNumber']" class="text-red-500 text-sm">{{ errors['agencyNumber'] }}</p>
        </div>

        <!-- Nom de l'agence -->
        <div class="grid gap-2">
          <label for="agencyName" class="text-sm font-medium text-gray-700">Nom de l'agence *</label>
          <input
            id="agencyName"
            type="text"
            placeholder="Ex: SecuriMar Services"
            [(ngModel)]="formData.agencyName"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['agencyName'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['agencyName']" class="text-red-500 text-sm">{{ errors['agencyName'] }}</p>
        </div>

        <!-- Numéro d'enregistrement -->
        <div class="grid gap-2">
          <label for="registrationNumber" class="text-sm font-medium text-gray-700">Numéro d'enregistrement</label>
          <input
            id="registrationNumber"
            type="text"
            placeholder="Numéro d'enregistrement"
            [(ngModel)]="formData.registrationNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Numéro de licence -->
        <div class="grid gap-2">
          <label for="licenseNumber" class="text-sm font-medium text-gray-700">Numéro de licence</label>
          <input
            id="licenseNumber"
            type="text"
            placeholder="Numéro de licence"
            [(ngModel)]="formData.licenseNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Contact Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Coordonnées</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Téléphone -->
        <div class="grid gap-2">
          <label for="phoneNumber" class="text-sm font-medium text-gray-700">Téléphone principal</label>
          <input
            id="phoneNumber"
            type="tel"
            placeholder="+229 XX XX XX XX"
            [(ngModel)]="formData.phoneNumber"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Téléphone 2 -->
        <div class="grid gap-2">
          <label for="phoneNumber2" class="text-sm font-medium text-gray-700">Téléphone secondaire</label>
          <input
            id="phoneNumber2"
            type="tel"
            placeholder="+229 XX XX XX XX"
            [(ngModel)]="formData.phoneNumber2"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Email -->
        <div class="grid gap-2">
          <label for="email" class="text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            type="email"
            placeholder="contact@agence.com"
            [(ngModel)]="formData.email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Site web -->
        <div class="grid gap-2">
          <label for="website" class="text-sm font-medium text-gray-700">Site web</label>
          <input
            id="website"
            type="url"
            placeholder="https://www.agence.com"
            [(ngModel)]="formData.website"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Address Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Adresse</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Adresse -->
        <div class="grid gap-2 col-span-2">
          <label for="address" class="text-sm font-medium text-gray-700">Adresse</label>
          <input
            id="address"
            type="text"
            placeholder="Rue, numéro, etc."
            [(ngModel)]="formData.address"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Ville -->
        <div class="grid gap-2">
          <label for="city" class="text-sm font-medium text-gray-700">Ville</label>
          <input
            id="city"
            type="text"
            placeholder="Nom de la ville"
            [(ngModel)]="formData.city"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Pays -->
        <div class="grid gap-2">
          <label for="country" class="text-sm font-medium text-gray-700">Pays</label>
          <input
            id="country"
            type="text"
            placeholder="Nom du pays"
            [(ngModel)]="formData.country"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Contact Person -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Personne de contact</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Personne de contact -->
        <div class="grid gap-2">
          <label for="contactPerson" class="text-sm font-medium text-gray-700">Nom complet</label>
          <input
            id="contactPerson"
            type="text"
            placeholder="Nom de la personne de contact"
            [(ngModel)]="formData.contactPerson"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Position du contact -->
        <div class="grid gap-2">
          <label for="contactPosition" class="text-sm font-medium text-gray-700">Position</label>
          <input
            id="contactPosition"
            type="text"
            placeholder="Ex: Directeur, Manager"
            [(ngModel)]="formData.contactPosition"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations complémentaires</h3>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
