<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Modifier cette agence de sécurité</h2>
          <p class="text-sm text-gray-500 mt-1">Modifiez les informations de cette agence de sécurité</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="grid gap-4">
      <!-- Numéro d'agence -->
      <div class="grid gap-2">
        <label for="agencyNumber" class="text-sm font-medium text-gray-700">Numéro d'agence *</label>
        <input
          id="agencyNumber"
          type="text"
          placeholder="Ex: AG-001"
          [(ngModel)]="formData.agencyNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['agencyNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['agencyNumber']" class="text-red-500 text-sm">{{ errors['agencyNumber'] }}</p>
      </div>

      <!-- Nom de l'agence -->
      <div class="grid gap-2">
        <label for="agencyName" class="text-sm font-medium text-gray-700">Nom de l'agence *</label>
        <input
          id="agencyName"
          type="text"
          placeholder="Ex: SecuriMar Services"
          [(ngModel)]="formData.agencyName"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['agencyName'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['agencyName']" class="text-red-500 text-sm">{{ errors['agencyName'] }}</p>
      </div>

      <!-- Téléphone -->
      <div class="grid gap-2">
        <label for="phoneNumber" class="text-sm font-medium text-gray-700">Téléphone</label>
        <input
          id="phoneNumber"
          type="tel"
          placeholder=""
          [(ngModel)]="formData.phoneNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['phoneNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['phoneNumber']" class="text-red-500 text-sm">{{ errors['phoneNumber'] }}</p>
      </div>

      <!-- Email -->
      <div class="grid gap-2">
        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
        <input
          id="email"
          type="email"
          placeholder=""
          [(ngModel)]="formData.email"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['email'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['email']" class="text-red-500 text-sm">{{ errors['email'] }}</p>
      </div>

      <!-- Adresse -->
      <div class="grid gap-2">
        <label for="address" class="text-sm font-medium text-gray-700">Adresse</label>
        <input
          id="address"
          type="text"
          placeholder=""
          [(ngModel)]="formData.address"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['address'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['address']" class="text-red-500 text-sm">{{ errors['address'] }}</p>
      </div>

      <!-- Personne de contact -->
      <div class="grid gap-2">
        <label for="contactPerson" class="text-sm font-medium text-gray-700">Personne de contact</label>
        <input
          id="contactPerson"
          type="text"
          placeholder=""
          [(ngModel)]="formData.contactPerson"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['contactPerson'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['contactPerson']" class="text-red-500 text-sm">{{ errors['contactPerson'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
        Enregistrer
      </button>
    </div>
  </div>
</div>
