<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une absence</h2>
          <p class="text-sm text-gray-500 mt-1">Créez une nouvelle demande d'absence</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Agent Selection -->
      <div class="grid gap-2">
        <label for="agent" class="text-sm font-medium text-gray-700">Agent</label>
        <!-- Champ de recherche -->
        <div class="relative mb-2">
          <input
            type="text"
            placeholder="Rechercher un agent par nom, prénom, matricule..."
            [(ngModel)]="agentSearchTerm"
            (ngModelChange)="onAgentSearch()"
            name="agentSearch"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          />
          <span *ngIf="agentSearchTerm"
                (click)="clearAgentSearch()"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer">
            ✕
          </span>
        </div>
        <select
          id="agent"
          [(ngModel)]="formData.agentTrackingId"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['agentTrackingId'] ? 'border-red-500' : 'border-gray-300')">
          <option value="">Sélectionner un agent</option>
          <option *ngFor="let agent of availableAgents" [value]="agent.trackingId">
            {{ agent.firstName }} {{ agent.lastName }}
          </option>
        </select>
        <p *ngIf="errors['agentTrackingId']" class="text-red-500 text-sm">{{ errors['agentTrackingId'] }}</p>
      </div>

      <!-- Type Selection -->
      <div class="grid gap-2">
        <label for="type" class="text-sm font-medium text-gray-700">Type d'absence</label>
        <select
          id="type"
          [(ngModel)]="formData.absenceType"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['absenceType'] ? 'border-red-500' : 'border-gray-300')">
          <option [value]="undefined">Sélectionner un type</option>
          <option *ngFor="let type of absenceTypes" [value]="type">
            {{ getTypeLabel(type) }}
          </option>
        </select>
        <p *ngIf="errors['absenceType']" class="text-red-500 text-sm">{{ errors['absenceType'] }}</p>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-2 gap-4">
        <div class="grid gap-2">
          <label for="startDate" class="text-sm font-medium text-gray-700">Date de début</label>
          <input
            id="startDate"
            type="date"
            [(ngModel)]="formData.startDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['startDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['startDate']" class="text-red-500 text-sm">{{ errors['startDate'] }}</p>
        </div>
        <div class="grid gap-2">
          <label for="endDate" class="text-sm font-medium text-gray-700">Date de fin</label>
          <input
            id="endDate"
            type="date"
            [(ngModel)]="formData.endDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['endDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['endDate']" class="text-red-500 text-sm">{{ errors['endDate'] }}</p>
        </div>
      </div>

      <!-- Days Display -->
      <div class="grid gap-2" *ngIf="calculateDays() > 0">
        <p class="text-sm text-gray-600">Nombre de jours: <span class="font-semibold">{{ calculateDays() }} jours</span></p>
      </div>

      <!-- Reason -->
      <div class="grid gap-2">
        <label for="reason" class="text-sm font-medium text-gray-700">Motif</label>
        <textarea
          id="reason"
          placeholder="Préciser le motif de l'absence"
          [(ngModel)]="formData.reason"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['reason'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['reason']" class="text-red-500 text-sm">{{ errors['reason'] }}</p>
      </div>

      <!-- Justification (Optional) -->
      <div class="grid gap-2">
        <label for="justification" class="text-sm font-medium text-gray-700">Justification (optionnel)</label>
        <textarea
          id="justification"
          placeholder="Document justificatif ou informations complémentaires"
          [(ngModel)]="formData.justification"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-900 text-white rounded-md hover:bg-blue-800 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
