<!-- Desktop Sidebar -->
<aside class="hidden md:flex w-60 flex-col bg-sidebar text-sidebar-foreground border-r border-sidebar-border h-screen sticky top-0">
  <!-- Logo -->
  <div class="p-6 border-b border-sidebar-border">
    <div class="flex items-center gap-2">
      <img src="/logo.png" alt="MIMA Logo" height="40" width="40">
      <h1 class="text-xl font-bold tracking-tight">MIMA</h1>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-4 overflow-y-auto">
    <div *ngFor="let section of navSections" class="space-y-2">
      <h2 class="px-4 text-xs font-semibold text-sidebar-foreground/60 uppercase tracking-wider mb-2">
        {{ section.title }}
      </h2>
      <a
        *ngFor="let item of section.items"
        [routerLink]="item.href"
        routerLinkActive="bg-sidebar-primary/20 text-sidebar-primary"
        class="flex items-center gap-3 px-4 py-2 rounded-lg text-sidebar-foreground hover:bg-sidebar-primary/10 transition-colors group"
      >
        <lucide-icon [img]="getIcon(item.icon)" class="w-5 h-5"></lucide-icon>
        <span class="text-sm font-medium">{{ item.label }}</span>
      </a>
    </div>
  </nav>


</aside>

<!-- Mobile Sidebar Drawer -->
<aside
  *ngIf="isMobileSidebarOpen"
  class="fixed inset-y-0 left-0 z-40 w-60 bg-sidebar text-sidebar-foreground md:hidden flex flex-col"
>
  <!-- Close button -->
  <div class="flex items-center justify-between p-4 border-b border-sidebar-border">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 bg-sidebar-primary rounded-lg flex items-center justify-center">
        <lucide-icon [img]="Anchor" class="w-6 h-6 text-sidebar-primary-foreground"></lucide-icon>
      </div>
      <h1 class="text-xl font-bold tracking-tight">MIMA</h1>
    </div>
    <button (click)="closeMobileSidebar()" class="p-1 hover:bg-sidebar-primary/10 rounded-lg">
      <lucide-icon [img]="X" class="w-6 h-6"></lucide-icon>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-4 overflow-y-auto">
    <div *ngFor="let section of navSections" class="space-y-2">
      <h2 class="px-4 text-xs font-semibold text-sidebar-foreground/60 uppercase tracking-wider mb-2">
        {{ section.title }}
      </h2>
      <a
        *ngFor="let item of section.items"
        [routerLink]="item.href"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-sidebar-primary/20 text-sidebar-primary"
        class="flex items-center gap-3 px-4 py-2 rounded-lg text-sidebar-foreground hover:bg-sidebar-primary/10 transition-colors group"
      >
        <lucide-icon [img]="getIcon(item.icon)" class="w-5 h-5"></lucide-icon>
        <span class="text-sm font-medium">{{ item.label }}</span>
      </a>
    </div>
  </nav>
</aside>

<!-- Mobile overlay -->
<div
  *ngIf="isMobileSidebarOpen"
  (click)="closeMobileSidebar()"
  class="fixed inset-0 bg-black/50 z-30 md:hidden"
></div>
