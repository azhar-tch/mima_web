<div class="min-h-screen flex">
  <!-- Left Side: Image -->
  <div class="hidden lg:block lg:w-1/2 bg-maritime-950 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-maritime-900 to-maritime-950 opacity-90"></div>
    <div class="relative h-full flex flex-col justify-center items-center text-white p-12">
      <div class="flex items-center gap-2">
      <img src="/logo.png" alt="MIMA Logo" height="100" width="100">
    </div>
      <h1 class="text-4xl font-bold mb-4">MIMA</h1>
      <p class="text-xl text-maritime-200">Gestion du Personnel Maritime</p>
      <div class="mt-12 space-y-4 text-maritime-200">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Gestion des missions et gardes</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Suivi des absences en temps réel</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span>Alertes et notifications</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Register Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-gray-50">
    <div class="max-w-md w-full">
      <!-- Logo for mobile -->
      <div class="lg:hidden text-center mb-8">
        <h1 class="text-3xl font-bold text-maritime-950">MIMA</h1>
        <p class="text-gray-600 mt-2">Gestion du Personnel Maritime</p>
      </div>

      <!-- Welcome -->
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-gray-900">Créer un compte</h2>
        <p class="text-gray-600 mt-2">Inscrivez-vous pour commencer</p>
      </div>

      <!-- Register Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- First Name & Last Name -->
        <div class="grid grid-cols-2 gap-4">
          <!-- First Name -->
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">
              Prénom
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input
                type="text" [(ngModel)]="firstName" name="firstName" required
                id="firstName"
                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
                placeholder="Jean"
              />
            </div>
          </div>

          <!-- Last Name -->
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
              Nom
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input
                type="text" [(ngModel)]="lastName" name="lastName" required
                id="lastName"
                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
                placeholder="Dupont"
              />
            </div>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
            <input
              type="email" [(ngModel)]="email" name="email" required
              id="email"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
              placeholder="votre.email@example.com"
            />
          </div>
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">
            Téléphone <span class="text-gray-400">(optionnel)</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
            </div>
            <input
              type="tel" [(ngModel)]="phoneNumber" name="phoneNumber"
              id="phoneNumber"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
              placeholder="+33 6 12 34 56 78"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Mot de passe
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              type="password" [(ngModel)]="password" name="password" required
              id="password"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
              placeholder="••••••••"
            />
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
            Confirmer le mot de passe
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
              id="confirmPassword"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-maritime-500 focus:border-maritime-500 outline-none transition-colors"
              placeholder="••••••••"
            />
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full bg-maritime-950 text-white py-3 px-4 rounded-lg font-medium hover:bg-maritime-900 focus:outline-none focus:ring-2 focus:ring-maritime-500 focus:ring-offset-2 transition-colors"
        >
          S'inscrire
        </button>
      </form>

      <!-- Footer -->
      <p class="mt-8 text-center text-sm text-gray-600">
        Vous avez déjà un compte?
        <a routerLink="/login" class="font-medium text-maritime-600 hover:text-maritime-500">
          Se connecter
        </a>
      </p>
    </div>
  </div>
</div>

<!-- Error Dialog -->
<app-error-dialog
  [open]="showErrorDialog"
  title="Erreur d'inscription"
  [message]="errorMessage"
  (openChange)="showErrorDialog = $event">
</app-error-dialog>
