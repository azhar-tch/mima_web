<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Signaler un incident de navire</h2>
          <p class="text-sm text-gray-500 mt-1">Créez un nouveau rapport d'incident</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- ID Navire commercial -->
      <div class="grid gap-2">
        <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">ID Navire commercial *</label>
        <input
          id="commercialShipTrackingId"
          type="text"
          placeholder="Ex: UUID du navire"
          [(ngModel)]="formData.commercialShipTrackingId"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['commercialShipTrackingId'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['commercialShipTrackingId']" class="text-red-500 text-sm">{{ errors['commercialShipTrackingId'] }}</p>
      </div>

      <!-- Date de l'incident -->
      <div class="grid gap-2">
        <label for="incidentDate" class="text-sm font-medium text-gray-700">Date de l'incident *</label>
        <input
          id="incidentDate"
          type="date"
          placeholder=""
          [(ngModel)]="formData.incidentDate"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['incidentDate'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['incidentDate']" class="text-red-500 text-sm">{{ errors['incidentDate'] }}</p>
      </div>

      <!-- Type d'incident -->
      <div class="grid gap-2">
        <label for="incidentType" class="text-sm font-medium text-gray-700">Type d'incident</label>
        <input
          id="incidentType"
          type="text"
          placeholder=""
          [(ngModel)]="formData.incidentType"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['incidentType'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['incidentType']" class="text-red-500 text-sm">{{ errors['incidentType'] }}</p>
      </div>

      <!-- Localisation -->
      <div class="grid gap-2">
        <label for="location" class="text-sm font-medium text-gray-700">Localisation</label>
        <input
          id="location"
          type="text"
          placeholder=""
          [(ngModel)]="formData.location"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['location'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['location']" class="text-red-500 text-sm">{{ errors['location'] }}</p>
      </div>

      <!-- Description -->
      <div class="grid gap-2">
        <label for="description" class="text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          placeholder=""
          [(ngModel)]="formData.description"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['description'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['description']" class="text-red-500 text-sm">{{ errors['description'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
