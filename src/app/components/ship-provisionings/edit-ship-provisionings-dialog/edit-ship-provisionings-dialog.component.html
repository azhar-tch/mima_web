<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Modifier cet avitaillement</h2>
          <p class="text-sm text-gray-500 mt-1">Modifiez les informations de cet avitaillement</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="grid gap-4">
      <!-- ID Navire commercial -->
      <div class="grid gap-2">
        <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">ID Navire commercial *</label>
        <input
          id="commercialShipTrackingId"
          type="text"
          placeholder="Ex: UUID du navire"
          [(ngModel)]="formData.commercialShipTrackingId"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['commercialShipTrackingId'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['commercialShipTrackingId']" class="text-red-500 text-sm">{{ errors['commercialShipTrackingId'] }}</p>
      </div>

      <!-- Date d'avitaillement -->
      <div class="grid gap-2">
        <label for="provisioningDate" class="text-sm font-medium text-gray-700">Date d'avitaillement *</label>
        <input
          id="provisioningDate"
          type="date"
          placeholder=""
          [(ngModel)]="formData.provisioningDate"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['provisioningDate'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['provisioningDate']" class="text-red-500 text-sm">{{ errors['provisioningDate'] }}</p>
      </div>

      <!-- Point d'avitaillement -->
      <div class="grid gap-2">
        <label for="provisioningPoint" class="text-sm font-medium text-gray-700">Point d'avitaillement</label>
        <input
          id="provisioningPoint"
          type="text"
          placeholder=""
          [(ngModel)]="formData.provisioningPoint"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['provisioningPoint'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['provisioningPoint']" class="text-red-500 text-sm">{{ errors['provisioningPoint'] }}</p>
      </div>

      <!-- Type d'avitaillement -->
      <div class="grid gap-2">
        <label for="provisioningType" class="text-sm font-medium text-gray-700">Type d'avitaillement</label>
        <input
          id="provisioningType"
          type="text"
          placeholder=""
          [(ngModel)]="formData.provisioningType"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['provisioningType'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['provisioningType']" class="text-red-500 text-sm">{{ errors['provisioningType'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
        Enregistrer
      </button>
    </div>
  </div>
</div>
