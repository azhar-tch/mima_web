<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter un avitaillement</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez un nouveau avitaillement</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Basic Information -->
      <div class="col-span-2 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de base</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- ID Navire commercial -->
        <div class="grid gap-2">
          <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">ID Navire commercial *</label>
          <input
            id="commercialShipTrackingId"
            type="text"
            placeholder="Ex: UUID du navire"
            [(ngModel)]="formData.commercialShipTrackingId"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['commercialShipTrackingId'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['commercialShipTrackingId']" class="text-red-500 text-sm">{{ errors['commercialShipTrackingId'] }}</p>
        </div>

        <!-- Date d'avitaillement -->
        <div class="grid gap-2">
          <label for="provisioningDate" class="text-sm font-medium text-gray-700">Date d'avitaillement *</label>
          <input
            id="provisioningDate"
            type="date"
            placeholder=""
            [(ngModel)]="formData.provisioningDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['provisioningDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['provisioningDate']" class="text-red-500 text-sm">{{ errors['provisioningDate'] }}</p>
        </div>

        <!-- Type d'avitaillement -->
        <div class="grid gap-2">
          <label for="provisioningType" class="text-sm font-medium text-gray-700">Type d'avitaillement</label>
          <input
            id="provisioningType"
            type="text"
            placeholder="Ex: Carburant, Vivres, etc."
            [(ngModel)]="formData.provisioningType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Point d'avitaillement -->
        <div class="grid gap-2">
          <label for="provisioningPoint" class="text-sm font-medium text-gray-700">Point d'avitaillement</label>
          <input
            id="provisioningPoint"
            type="text"
            placeholder="Ex: Port de Cotonou"
            [(ngModel)]="formData.provisioningPoint"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Supplier Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations fournisseur</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Nom du fournisseur -->
        <div class="grid gap-2">
          <label for="supplierName" class="text-sm font-medium text-gray-700">Nom du fournisseur</label>
          <input
            id="supplierName"
            type="text"
            placeholder="Nom du fournisseur"
            [(ngModel)]="formData.supplierName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Nom du navire ravitailleur -->
        <div class="grid gap-2">
          <label for="supplyVesselName" class="text-sm font-medium text-gray-700">Navire ravitailleur</label>
          <input
            id="supplyVesselName"
            type="text"
            placeholder="Nom du navire ravitailleur"
            [(ngModel)]="formData.supplyVesselName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- IMO du navire ravitailleur -->
        <div class="grid gap-2 col-span-2">
          <label for="supplyVesselImo" class="text-sm font-medium text-gray-700">IMO du navire ravitailleur</label>
          <input
            id="supplyVesselImo"
            type="text"
            placeholder="Numéro IMO"
            [(ngModel)]="formData.supplyVesselImo"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Product Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Détails produits</h3>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <!-- Type de produit -->
        <div class="grid gap-2">
          <label for="productType" class="text-sm font-medium text-gray-700">Type de produit</label>
          <input
            id="productType"
            type="text"
            placeholder="Ex: Diesel, Eau, Nourriture"
            [(ngModel)]="formData.productType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Quantité -->
        <div class="grid gap-2">
          <label for="quantity" class="text-sm font-medium text-gray-700">Quantité</label>
          <input
            id="quantity"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.quantity"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Unité -->
        <div class="grid gap-2">
          <label for="unit" class="text-sm font-medium text-gray-700">Unité</label>
          <input
            id="unit"
            type="text"
            placeholder="Ex: L, T, kg"
            [(ngModel)]="formData.unit"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Montant -->
        <div class="grid gap-2 col-span-3">
          <label for="amount" class="text-sm font-medium text-gray-700">Montant</label>
          <input
            id="amount"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.amount"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Timing Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Horaires</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Heure de début -->
        <div class="grid gap-2">
          <label for="startTime" class="text-sm font-medium text-gray-700">Heure de début</label>
          <input
            id="startTime"
            type="datetime-local"
            [(ngModel)]="formData.startTime"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Heure de fin -->
        <div class="grid gap-2">
          <label for="endTime" class="text-sm font-medium text-gray-700">Heure de fin</label>
          <input
            id="endTime"
            type="datetime-local"
            [(ngModel)]="formData.endTime"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Delay Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de retard</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- A un retard -->
        <div class="grid gap-2">
          <label for="hasDelay" class="text-sm font-medium text-gray-700">A un retard</label>
          <select
            id="hasDelay"
            [(ngModel)]="formData.hasDelay"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [ngValue]="undefined">Non spécifié</option>
            <option [ngValue]="true">Oui</option>
            <option [ngValue]="false">Non</option>
          </select>
        </div>

        <!-- Durée du retard (heures) -->
        <div class="grid gap-2">
          <label for="delayDurationHours" class="text-sm font-medium text-gray-700">Durée du retard (heures)</label>
          <input
            id="delayDurationHours"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.delayDurationHours"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Raison du retard -->
        <div class="grid gap-2">
          <label for="delayReason" class="text-sm font-medium text-gray-700">Raison du retard</label>
          <textarea
            id="delayReason"
            placeholder="Décrire les raisons du retard"
            [(ngModel)]="formData.delayReason"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="2"
          ></textarea>
        </div>

        <!-- Pénalité de retard -->
        <div class="grid gap-2">
          <label for="delayPenalty" class="text-sm font-medium text-gray-700">Pénalité de retard</label>
          <input
            id="delayPenalty"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.delayPenalty"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Actions correctives -->
        <div class="grid gap-2 col-span-2">
          <label for="correctiveActions" class="text-sm font-medium text-gray-700">Actions correctives</label>
          <textarea
            id="correctiveActions"
            placeholder="Actions entreprises pour corriger le retard"
            [(ngModel)]="formData.correctiveActions"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            rows="2"
          ></textarea>
        </div>

        <!-- À l'heure -->
        <div class="grid gap-2">
          <label for="isOnTime" class="text-sm font-medium text-gray-700">À l'heure</label>
          <select
            id="isOnTime"
            [(ngModel)]="formData.isOnTime"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [ngValue]="undefined">Non spécifié</option>
            <option [ngValue]="true">Oui</option>
            <option [ngValue]="false">Non</option>
          </select>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations complémentaires</h3>
      </div>

      <!-- Incidents -->
      <div class="grid gap-2">
        <label for="incidents" class="text-sm font-medium text-gray-700">Incidents</label>
        <textarea
          id="incidents"
          placeholder="Décrire tout incident survenu"
          [(ngModel)]="formData.incidents"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
