<div class="max-w-7xl mx-auto p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Postes de service</h1>
      <p class="text-sm text-gray-500 mt-1">Gérez les postes de service</p>
    </div>
    <button
      (click)="openAdditionsDialog()"
      class="flex items-center gap-2 px-4 py-2 bg-blue-900 text-white rounded-lg hover:bg-blue-800 transition-colors">
      <lucide-icon [img]="Plus" [size]="20"></lucide-icon>
      <span>Ajouter postes de service</span>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
    <div class="relative">
      <lucide-icon [img]="Search" [size]="20" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></lucide-icon>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Rechercher par nom ou description..."
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>

  <!-- itionss Table -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div *ngIf="isLoading" class="p-8 text-center text-gray-500">
      Chargement...
    </div>

    <div *ngIf="!isLoading && filtereditionss.length === 0" class="p-8 text-center text-gray-500">
      Aucun service trouvé
    </div>

    <div *ngIf="!isLoading && filtereditionss.length > 0" class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom du service</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let service of filtereditionss" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ service.positionName }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-500">{{ service.positionType || '-' }}</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-500">{{ service.description || '-' }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right">
              <div class="flex items-center justify-end gap-2">
                <button
                  (click)="openitionsDetailsDialog(service)"
                  class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                  title="Voir les détails">
                  <lucide-icon [img]="Eye" [size]="18"></lucide-icon>
                </button>
                <button
                  (click)="openEdititionsDialog(service)"
                  class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors"
                  title="Modifier">
                  <lucide-icon [img]="Edit" [size]="18"></lucide-icon>
                </button>
                <button
                  (click)="openDeleteitionsDialog(service)"
                  class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                  title="Supprimer">
                  <lucide-icon [img]="Trash2" [size]="18"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
