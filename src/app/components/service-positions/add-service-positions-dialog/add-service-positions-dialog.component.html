<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter un poste de service</h2>
          <p class="text-sm text-gray-500 mt-1">Créez un nouveau grade RH</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Position Name -->
      <div class="grid gap-2">
        <label for="positionName" class="text-sm font-medium text-gray-700">Nom du poste *</label>
        <input
          id="positionName"
          type="text"
          placeholder="Ex: Chef de quart, Officier de pont..."
          [(ngModel)]="formData.positionName"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['positionName'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['positionName']" class="text-red-500 text-sm">{{ errors['positionName'] }}</p>
      </div>

      <!-- Position Type -->
      <div class="grid gap-2">
        <label for="positionType" class="text-sm font-medium text-gray-700">Type de poste</label>
        <input
          id="positionType"
          type="text"
          placeholder="Ex: Commandement, Opérationnel, Technique..."
          [(ngModel)]="formData.positionType"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Location -->
      <div class="grid gap-2">
        <label for="location" class="text-sm font-medium text-gray-700">Localisation</label>
        <input
          id="location"
          type="text"
          placeholder="Ex: Pont, Salle des machines..."
          [(ngModel)]="formData.location"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Unit -->
      <div class="grid gap-2">
        <label for="unit" class="text-sm font-medium text-gray-700">Unité</label>
        <input
          id="unit"
          type="text"
          placeholder="Ex: Division Navigation, Service Technique..."
          [(ngModel)]="formData.unit"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Description -->
      <div class="grid gap-2">
        <label for="description" class="text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          placeholder="Décrivez ce poste de service (optionnel)"
          [(ngModel)]="formData.description"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-900 text-white rounded-md hover:bg-blue-800 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
