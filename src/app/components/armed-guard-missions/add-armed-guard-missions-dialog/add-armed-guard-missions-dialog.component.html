<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une mission de garde armée</h2>
          <p class="text-sm text-gray-500 mt-1">Créez une nouvelle mission de garde armée</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro de mission -->
      <div class="grid gap-2">
        <label for="missionNumber" class="text-sm font-medium text-gray-700">Numéro de mission *</label>
        <input
          id="missionNumber"
          type="text"
          placeholder="Ex: AGM-2024-001"
          [(ngModel)]="formData.missionNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['missionNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['missionNumber']" class="text-red-500 text-sm">{{ errors['missionNumber'] }}</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Navire commercial -->
        <div class="grid gap-2">
          <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">Navire commercial</label>
          <select
            id="commercialShipTrackingId"
            [(ngModel)]="formData.commercialShipTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un navire</option>
            <option *ngFor="let ship of commercialShips" [value]="ship.trackingId">
              {{ ship.shipName }} ({{ ship.imoNumber }})
            </option>
          </select>
        </div>

        <!-- Agence de sécurité -->
        <div class="grid gap-2">
          <label for="securityAgencyTrackingId" class="text-sm font-medium text-gray-700">Agence de sécurité</label>
          <select
            id="securityAgencyTrackingId"
            [(ngModel)]="formData.securityAgencyTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner une agence</option>
            <option *ngFor="let agency of securityAgencies" [value]="agency.trackingId">
              {{ agency.agencyName }} ({{ agency.agencyNumber }})
            </option>
          </select>
        </div>
      </div>

      <!-- Date d'embarquement -->
      <div class="grid gap-2">
        <label for="embarkationDate" class="text-sm font-medium text-gray-700">Date d'embarquement *</label>
        <input
          id="embarkationDate"
          type="date"
          placeholder=""
          [(ngModel)]="formData.embarkationDate"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['embarkationDate'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['embarkationDate']" class="text-red-500 text-sm">{{ errors['embarkationDate'] }}</p>
      </div>

      <!-- Date de débarquement -->
      <div class="grid gap-2">
        <label for="disembarkationDate" class="text-sm font-medium text-gray-700">Date de débarquement</label>
        <input
          id="disembarkationDate"
          type="date"
          placeholder=""
          [(ngModel)]="formData.disembarkationDate"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['disembarkationDate'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['disembarkationDate']" class="text-red-500 text-sm">{{ errors['disembarkationDate'] }}</p>
      </div>

      <!-- Port d'embarquement -->
      <div class="grid gap-2">
        <label for="embarkationPort" class="text-sm font-medium text-gray-700">Port d'embarquement *</label>
        <input
          id="embarkationPort"
          type="text"
          placeholder=""
          [(ngModel)]="formData.embarkationPort"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['embarkationPort'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['embarkationPort']" class="text-red-500 text-sm">{{ errors['embarkationPort'] }}</p>
      </div>

      <!-- Port de débarquement -->
      <div class="grid gap-2">
        <label for="disembarkationPort" class="text-sm font-medium text-gray-700">Port de débarquement</label>
        <input
          id="disembarkationPort"
          type="text"
          placeholder=""
          [(ngModel)]="formData.disembarkationPort"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['disembarkationPort'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['disembarkationPort']" class="text-red-500 text-sm">{{ errors['disembarkationPort'] }}</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Nombre de jours -->
        <div class="grid gap-2">
          <label for="daysCount" class="text-sm font-medium text-gray-700">Nombre de jours</label>
          <input
            id="daysCount"
            type="number"
            placeholder="0"
            [(ngModel)]="formData.daysCount"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Nombre de personnel -->
        <div class="grid gap-2">
          <label for="personnelCount" class="text-sm font-medium text-gray-700">Nombre de personnel</label>
          <input
            id="personnelCount"
            type="number"
            placeholder="Ex: 4"
            [(ngModel)]="formData.personnelCount"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Zone de patrouille -->
      <div class="grid gap-2">
        <label for="patrolZone" class="text-sm font-medium text-gray-700">Zone de patrouille</label>
        <input
          id="patrolZone"
          type="text"
          placeholder="Zone maritime"
          [(ngModel)]="formData.patrolZone"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Incidents -->
      <div class="grid gap-2">
        <label for="incidents" class="text-sm font-medium text-gray-700">Incidents</label>
        <textarea
          id="incidents"
          placeholder="Décrire tout incident survenu"
          [(ngModel)]="formData.incidents"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
