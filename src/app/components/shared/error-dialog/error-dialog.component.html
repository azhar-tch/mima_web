<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-md w-full mx-4 p-6 z-50">
    <!-- Header -->
    <div class="flex items-start gap-4 mb-4">
      <div class="flex-shrink-0 w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
        <lucide-icon [img]="CircleAlert" [size]="24" class="text-red-600"></lucide-icon>
      </div>
      <div class="flex-1">
        <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
        <p class="text-sm text-gray-600 mt-1">{{ message }}</p>
      </div>
      <button
        (click)="handleClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors">
        <lucide-icon [img]="X" [size]="20"></lucide-icon>
      </button>
    </div>

    <!-- Footer -->
    <div class="flex justify-end">
      <button
        (click)="handleClose()"
        class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors"
      >
        Fermer
      </button>
    </div>
  </div>
</div>
