<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Modifier cette indemnité</h2>
          <p class="text-sm text-gray-500 mt-1">Modifiez les informations de cette indemnité</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="grid gap-4">
      <!-- Code de grade -->
      <div class="grid gap-2">
        <label for="rankCode" class="text-sm font-medium text-gray-700">Code de grade *</label>
        <input
          id="rankCode"
          type="text"
          placeholder="Ex: CDT"
          [(ngModel)]="formData.rankCode"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['rankCode'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['rankCode']" class="text-red-500 text-sm">{{ errors['rankCode'] }}</p>
      </div>

      <!-- Grade maritime -->
      <div class="grid gap-2">
        <label for="maritimeRank" class="text-sm font-medium text-gray-700">Grade maritime *</label>
        <select
          id="maritimeRank"
          [(ngModel)]="formData.maritimeRank"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['maritimeRank'] ? 'border-red-500' : 'border-gray-300')">
          <option value="">Sélectionner un grade</option>
          <option *ngFor="let rank of maritimeRanks" [value]="rank.value">{{ rank.label }}</option>
        </select>
        <p *ngIf="errors['maritimeRank']" class="text-red-500 text-sm">{{ errors['maritimeRank'] }}</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Indemnité journalière d'escorte -->
        <div class="grid gap-2">
          <label for="escortDailyAllowance" class="text-sm font-medium text-gray-700">Indemnité journalière d'escorte</label>
          <input
            id="escortDailyAllowance"
            type="number"
            placeholder="0.00"
            [(ngModel)]="formData.escortDailyAllowance" min="0" step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Indemnité journalière garde armée -->
        <div class="grid gap-2">
          <label for="armedGuardDailyAllowance" class="text-sm font-medium text-gray-700">Indemnité journalière garde armée</label>
          <input
            id="armedGuardDailyAllowance"
            type="number"
            placeholder="0.00"
            [(ngModel)]="formData.armedGuardDailyAllowance" min="0" step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Indemnité de patrouille -->
        <div class="grid gap-2">
          <label for="patrolAllowance" class="text-sm font-medium text-gray-700">Indemnité de patrouille</label>
          <input
            id="patrolAllowance"
            type="number"
            placeholder="0.00"
            [(ngModel)]="formData.patrolAllowance" min="0" step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Indemnité de risque -->
        <div class="grid gap-2">
          <label for="riskAllowance" class="text-sm font-medium text-gray-700">Indemnité de risque</label>
          <input
            id="riskAllowance"
            type="number"
            placeholder="0.00"
            [(ngModel)]="formData.riskAllowance" min="0" step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Indemnité de mer -->
        <div class="grid gap-2">
          <label for="seaAllowance" class="text-sm font-medium text-gray-700">Indemnité de mer</label>
          <input
            id="seaAllowance"
            type="number"
            placeholder="0.00"
            [(ngModel)]="formData.seaAllowance" min="0" step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Devise -->
        <div class="grid gap-2">
          <label for="currency" class="text-sm font-medium text-gray-700">Devise</label>
          <input
            id="currency"
            type="text"
            placeholder="Ex: XOF, EUR, USD"
            [(ngModel)]="formData.currency"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Statut actif -->
        <div class="grid gap-2">
          <label for="isActive" class="text-sm font-medium text-gray-700">Statut</label>
          <select
            id="isActive"
            [(ngModel)]="formData.isActive"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [ngValue]="undefined">Non spécifié</option>
            <option [ngValue]="true">Actif</option>
            <option [ngValue]="false">Inactif</option>
          </select>
        </div>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
        Enregistrer
      </button>
    </div>
  </div>
</div>
