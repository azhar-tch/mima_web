<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Modifier une formation</h2>
          <p class="text-sm text-gray-500 mt-1">Modifiez les informations de la formation</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Training Name -->
      <div class="grid gap-2">
        <label for="trainingName" class="text-sm font-medium text-gray-700">Nom de la formation *</label>
        <input
          id="trainingName"
          type="text"
          placeholder="Ex: Master en Sciences Politiques, Licence en Droit..."
          [(ngModel)]="formData.trainingName"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['trainingName'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['trainingName']" class="text-red-500 text-sm">{{ errors['trainingName'] }}</p>
      </div>

      <!-- Training Type -->
      <div class="grid gap-2">
        <label for="trainingType" class="text-sm font-medium text-gray-700">Type de formation</label>
        <input
          id="trainingType"
          type="text"
          placeholder="Ex: Diplôme universitaire, Formation professionnelle, Certification..."
          [(ngModel)]="formData.trainingType"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Institution -->
      <div class="grid gap-2">
        <label for="institution" class="text-sm font-medium text-gray-700">Institution</label>
        <input
          id="institution"
          type="text"
          placeholder="Ex: Université de Yaoundé, École Militaire Inter-Armées..."
          [(ngModel)]="formData.institution"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Country -->
      <div class="grid gap-2">
        <label for="country" class="text-sm font-medium text-gray-700">Pays</label>
        <input
          id="country"
          type="text"
          placeholder="Ex: Cameroun, France, États-Unis..."
          [(ngModel)]="formData.country"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Description -->
      <div class="grid gap-2">
        <label for="description" class="text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          placeholder="Décrivez cette formation (optionnel)"
          [(ngModel)]="formData.description"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-900 text-white rounded-md hover:bg-blue-800 transition-colors">
        Enregistrer
      </button>
    </div>
  </div>
</div>
