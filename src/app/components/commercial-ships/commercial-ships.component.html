<div class="max-w-7xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Navires Commerciaux</h1>
    <button
      (click)="showAddDialog()"
      class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
      <lucide-icon [img]="Plus" [size]="20"></lucide-icon>
      <span>Ajouter</span>
    </button>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
    <div class="relative">
      <lucide-icon [img]="Search" [size]="20" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></lucide-icon>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Rechercher..."
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div *ngIf="isLoading" class="p-8 text-center text-gray-500">
      Chargement...
    </div>

    <div *ngIf="!isLoading && filteredCommercialShipss.length === 0" class="p-8 text-center text-gray-500">
      Aucun élément trouvé
    </div>

    <div *ngIf="!isLoading && filteredCommercialShipss.length > 0" class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom du navire</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Numéro IMO</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pavillon</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let item of filteredCommercialShipss" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ item.shipName || '-' }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">{{ item.imoNumber || '-' }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">
                {{ item.shipType || '-' }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
              {{ item.flag || '-' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right">
              <div class="flex items-center justify-end gap-2">
                <button (click)="openDetailsDialog(item)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Voir les détails">
                  <lucide-icon [img]="Eye" [size]="18"></lucide-icon>
                </button>
                <button (click)="showEditDialog(item)" class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors" title="Modifier">
                  <lucide-icon [img]="Edit" [size]="18"></lucide-icon>
                </button>
                <button (click)="showDeleteDialog(item)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Supprimer">
                  <lucide-icon [img]="Trash2" [size]="18"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<!-- Add Dialog -->
<app-add-commercial-ships-dialog
  *ngIf="openAddDialog"
  (close)="openAddDialog = false"
  (add)="handleAdd($event)">
</app-add-commercial-ships-dialog>

<!-- Edit Dialog -->
<app-edit-commercial-ships-dialog
  *ngIf="openEditDialog && selectedItem"
  [item]="selectedItem"
  (close)="openEditDialog = false"
  (save)="handleEdit($event)">
</app-edit-commercial-ships-dialog>

<!-- Delete Dialog -->
<app-delete-commercial-ships-dialog
  *ngIf="openDeleteDialog && selectedItem"
  [item]="selectedItem"
  (close)="openDeleteDialog = false"
  (confirm)="handleDelete()">
</app-delete-commercial-ships-dialog>

<!-- Details Dialog -->
<app-commercial-ship-details-dialog
  *ngIf="showDetailsDialog && selectedItem"
  [ship]="selectedItem"
  (close)="showDetailsDialog = false">
</app-commercial-ship-details-dialog>
</div>
