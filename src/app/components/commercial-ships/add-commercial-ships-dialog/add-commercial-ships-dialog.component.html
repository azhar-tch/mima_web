<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter un navire commercial</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez un nouveau navire commercial</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro IMO -->
      <div class="grid gap-2">
        <label for="imoNumber" class="text-sm font-medium text-gray-700">Numéro IMO *</label>
        <input
          id="imoNumber"
          type="text"
          placeholder="Ex: IMO1234567"
          [(ngModel)]="formData.imoNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['imoNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['imoNumber']" class="text-red-500 text-sm">{{ errors['imoNumber'] }}</p>
      </div>

      <!-- Nom du navire -->
      <div class="grid gap-2">
        <label for="shipName" class="text-sm font-medium text-gray-700">Nom du navire *</label>
        <input
          id="shipName"
          type="text"
          placeholder="Ex: MV Atlantic Star"
          [(ngModel)]="formData.shipName"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['shipName'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['shipName']" class="text-red-500 text-sm">{{ errors['shipName'] }}</p>
      </div>

      <!-- Type de navire -->
      <div class="grid gap-2">
        <label for="shipType" class="text-sm font-medium text-gray-700">Type de navire *</label>
        <input
          id="shipType"
          type="text"
          placeholder="Ex: Cargo, Tanker"
          [(ngModel)]="formData.shipType"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['shipType'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['shipType']" class="text-red-500 text-sm">{{ errors['shipType'] }}</p>
      </div>

      <!-- Pavillon -->
      <div class="grid gap-2">
        <label for="flag" class="text-sm font-medium text-gray-700">Pavillon *</label>
        <input
          id="flag"
          type="text"
          placeholder="Ex: France"
          [(ngModel)]="formData.flag"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['flag'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['flag']" class="text-red-500 text-sm">{{ errors['flag'] }}</p>
      </div>

      <!-- MMSI -->
      <div class="grid gap-2">
        <label for="mmsi" class="text-sm font-medium text-gray-700">MMSI</label>
        <input
          id="mmsi"
          type="text"
          placeholder=""
          [(ngModel)]="formData.mmsi"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['mmsi'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['mmsi']" class="text-red-500 text-sm">{{ errors['mmsi'] }}</p>
      </div>

      <!-- Indicatif d'appel -->
      <div class="grid gap-2">
        <label for="callSign" class="text-sm font-medium text-gray-700">Indicatif d'appel</label>
        <input
          id="callSign"
          type="text"
          placeholder=""
          [(ngModel)]="formData.callSign"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['callSign'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['callSign']" class="text-red-500 text-sm">{{ errors['callSign'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
