<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Modifier cette mission d'escorte</h2>
          <p class="text-sm text-gray-500 mt-1">Modifiez les informations de cette mission d'escorte</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Basic Information -->
      <div class="col-span-2 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de base</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Numéro de mission -->
        <div class="grid gap-2 col-span-2">
          <label for="missionNumber" class="text-sm font-medium text-gray-700">Numéro de mission *</label>
          <input
            id="missionNumber"
            type="text"
            placeholder="Ex: ESC-2024-001"
            [(ngModel)]="formData.missionNumber"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['missionNumber'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['missionNumber']" class="text-red-500 text-sm">{{ errors['missionNumber'] }}</p>
        </div>

        <!-- Navire commercial -->
        <div class="grid gap-2">
          <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">Navire commercial</label>
          <select
            id="commercialShipTrackingId"
            [(ngModel)]="formData.commercialShipTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un navire</option>
            <option *ngFor="let ship of commercialShips" [value]="ship.trackingId">
              {{ ship.shipName }} ({{ ship.imoNumber }})
            </option>
          </select>
        </div>

        <!-- Agence de sécurité -->
        <div class="grid gap-2">
          <label for="securityAgencyTrackingId" class="text-sm font-medium text-gray-700">Agence de sécurité</label>
          <select
            id="securityAgencyTrackingId"
            [(ngModel)]="formData.securityAgencyTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner une agence</option>
            <option *ngFor="let agency of securityAgencies" [value]="agency.trackingId">
              {{ agency.agencyName }} ({{ agency.agencyNumber }})
            </option>
          </select>
        </div>
      </div>

      <!-- Naval Vessels -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Navires militaires</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Navire naval principal -->
        <div class="grid gap-2">
          <label for="navalVesselTrackingId" class="text-sm font-medium text-gray-700">Navire naval principal</label>
          <select
            id="navalVesselTrackingId"
            [(ngModel)]="formData.navalVesselTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un navire naval</option>
            <option *ngFor="let vessel of navalVessels" [value]="vessel.trackingId">
              {{ vessel.vesselName }} ({{ vessel.vesselNumber }})
            </option>
          </select>
        </div>

        <!-- Navire secondaire -->
        <div class="grid gap-2">
          <label for="secondaryVesselTrackingId" class="text-sm font-medium text-gray-700">Navire secondaire</label>
          <select
            id="secondaryVesselTrackingId"
            [(ngModel)]="formData.secondaryVesselTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un navire secondaire</option>
            <option *ngFor="let vessel of navalVessels" [value]="vessel.trackingId">
              {{ vessel.vesselName }} ({{ vessel.vesselNumber }})
            </option>
          </select>
        </div>

        <!-- Commandant -->
        <div class="grid gap-2 col-span-2">
          <label class="text-sm font-medium text-gray-700">Commandant</label>

          <!-- Champ de recherche -->
          <div class="relative">
            <input
              type="text"
              placeholder="Rechercher un agent par nom, prénom, matricule..."
              [(ngModel)]="agentSearchTerm"
              (ngModelChange)="onAgentSearch()"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            />
            <span *ngIf="agentSearchTerm"
                  (click)="clearAgentSearch()"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer">
              ✕
            </span>
          </div>

          <!-- Dropdown des agents -->
          <select
            id="commanderTrackingId"
            [(ngModel)]="formData.commanderTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un commandant</option>
            <option *ngFor="let agent of agents" [value]="agent.trackingId">
              {{ agent.firstName }} {{ agent.lastName }}
            </option>
          </select>
        </div>

        <!-- Vedettes -->
        <div class="grid gap-2">
          <label for="vedettes" class="text-sm font-medium text-gray-700">Vedettes</label>
          <input
            id="vedettes"
            type="text"
            placeholder="Liste des vedettes"
            [(ngModel)]="formData.vedettes"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Mission Details -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Détails de la mission</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Date de début -->
        <div class="grid gap-2">
          <label for="startDate" class="text-sm font-medium text-gray-700">Date de début *</label>
          <input
            id="startDate"
            type="date"
            [(ngModel)]="formData.startDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['startDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['startDate']" class="text-red-500 text-sm">{{ errors['startDate'] }}</p>
        </div>

        <!-- Date de fin -->
        <div class="grid gap-2">
          <label for="endDate" class="text-sm font-medium text-gray-700">Date de fin</label>
          <input
            id="endDate"
            type="date"
            [(ngModel)]="formData.endDate"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Type d'escorte -->
        <div class="grid gap-2 col-span-2">
          <label for="escortType" class="text-sm font-medium text-gray-700">Type d'escorte</label>
          <select
            id="escortType"
            [(ngModel)]="formData.escortType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let type of escortTypes" [value]="type">
              {{ type === 'HAUTE_SECURITE' ? 'Haute sécurité' :
                 type === 'INTERNATIONALE' ? 'Internationale' :
                 type === 'COTIERE' ? 'Côtière' :
                 type === 'HAUTURIERE' ? 'Hauturière' :
                 type === 'URGENCE' ? 'Urgence' :
                 'Standard' }}
            </option>
          </select>
        </div>

        <!-- Point de départ -->
        <div class="grid gap-2">
          <label for="departurePoint" class="text-sm font-medium text-gray-700">Point de départ *</label>
          <input
            id="departurePoint"
            type="text"
            placeholder="Lieu de départ"
            [(ngModel)]="formData.departurePoint"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['departurePoint'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['departurePoint']" class="text-red-500 text-sm">{{ errors['departurePoint'] }}</p>
        </div>

        <!-- Point d'arrivée -->
        <div class="grid gap-2">
          <label for="arrivalPoint" class="text-sm font-medium text-gray-700">Point d'arrivée</label>
          <input
            id="arrivalPoint"
            type="text"
            placeholder="Lieu d'arrivée"
            [(ngModel)]="formData.arrivalPoint"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Distance -->
        <div class="grid gap-2">
          <label for="distance" class="text-sm font-medium text-gray-700">Distance (nm)</label>
          <input
            id="distance"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.distance"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Zone d'escorte -->
        <div class="grid gap-2">
          <label for="escortZone" class="text-sm font-medium text-gray-700">Zone d'escorte</label>
          <input
            id="escortZone"
            type="text"
            placeholder="Zone maritime"
            [(ngModel)]="formData.escortZone"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Statut -->
        <div class="grid gap-2">
          <label for="status" class="text-sm font-medium text-gray-700">Statut</label>
          <select
            id="status"
            [(ngModel)]="formData.status"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Sélectionner un statut</option>
            <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
          </select>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations complémentaires</h3>
      </div>

      <!-- Incidents -->
      <div class="grid gap-2">
        <label for="incidents" class="text-sm font-medium text-gray-700">Incidents</label>
        <textarea
          id="incidents"
          placeholder="Décrire tout incident survenu"
          [(ngModel)]="formData.incidents"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">
        Enregistrer
      </button>
    </div>
  </div>
</div>
