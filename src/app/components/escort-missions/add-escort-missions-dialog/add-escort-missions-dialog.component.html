<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une mission d'escorte</h2>
          <p class="text-sm text-gray-500 mt-1">Créez une nouvelle mission d'escorte</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Basic Information -->
      <div class="col-span-2 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations de base</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Numéro de mission -->
        <div class="grid gap-2 col-span-2">
          <label for="missionNumber" class="text-sm font-medium text-gray-700">Numéro de mission *</label>
          <input
            id="missionNumber"
            type="text"
            placeholder="Ex: ESC-2024-001"
            [(ngModel)]="formData.missionNumber"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['missionNumber'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['missionNumber']" class="text-red-500 text-sm">{{ errors['missionNumber'] }}</p>
        </div>

        <!-- ID Navire commercial -->
        <div class="grid gap-2">
          <label for="commercialShipTrackingId" class="text-sm font-medium text-gray-700">ID Navire commercial</label>
          <input
            id="commercialShipTrackingId"
            type="text"
            placeholder="UUID du navire"
            [(ngModel)]="formData.commercialShipTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- ID Agence de sécurité -->
        <div class="grid gap-2">
          <label for="securityAgencyTrackingId" class="text-sm font-medium text-gray-700">ID Agence de sécurité</label>
          <input
            id="securityAgencyTrackingId"
            type="text"
            placeholder="UUID de l'agence"
            [(ngModel)]="formData.securityAgencyTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Naval Vessels -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Navires militaires</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- ID Navire naval -->
        <div class="grid gap-2">
          <label for="navalVesselTrackingId" class="text-sm font-medium text-gray-700">ID Navire naval principal</label>
          <input
            id="navalVesselTrackingId"
            type="text"
            placeholder="UUID du navire naval"
            [(ngModel)]="formData.navalVesselTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- ID Navire secondaire -->
        <div class="grid gap-2">
          <label for="secondaryVesselTrackingId" class="text-sm font-medium text-gray-700">ID Navire secondaire</label>
          <input
            id="secondaryVesselTrackingId"
            type="text"
            placeholder="UUID du navire secondaire"
            [(ngModel)]="formData.secondaryVesselTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- ID Commandant -->
        <div class="grid gap-2">
          <label for="commanderTrackingId" class="text-sm font-medium text-gray-700">ID Commandant</label>
          <input
            id="commanderTrackingId"
            type="text"
            placeholder="UUID du commandant"
            [(ngModel)]="formData.commanderTrackingId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Vedettes -->
        <div class="grid gap-2">
          <label for="vedettes" class="text-sm font-medium text-gray-700">Vedettes</label>
          <input
            id="vedettes"
            type="text"
            placeholder="Liste des vedettes"
            [(ngModel)]="formData.vedettes"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Mission Details -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Détails de la mission</h3>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- Date de début -->
        <div class="grid gap-2">
          <label for="startDate" class="text-sm font-medium text-gray-700">Date de début *</label>
          <input
            id="startDate"
            type="date"
            [(ngModel)]="formData.startDate"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['startDate'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['startDate']" class="text-red-500 text-sm">{{ errors['startDate'] }}</p>
        </div>

        <!-- Date de fin -->
        <div class="grid gap-2">
          <label for="endDate" class="text-sm font-medium text-gray-700">Date de fin</label>
          <input
            id="endDate"
            type="date"
            [(ngModel)]="formData.endDate"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Point de départ -->
        <div class="grid gap-2">
          <label for="departurePoint" class="text-sm font-medium text-gray-700">Point de départ *</label>
          <input
            id="departurePoint"
            type="text"
            placeholder="Lieu de départ"
            [(ngModel)]="formData.departurePoint"
            [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['departurePoint'] ? 'border-red-500' : 'border-gray-300')"/>
          <p *ngIf="errors['departurePoint']" class="text-red-500 text-sm">{{ errors['departurePoint'] }}</p>
        </div>

        <!-- Point d'arrivée -->
        <div class="grid gap-2">
          <label for="arrivalPoint" class="text-sm font-medium text-gray-700">Point d'arrivée</label>
          <input
            id="arrivalPoint"
            type="text"
            placeholder="Lieu d'arrivée"
            [(ngModel)]="formData.arrivalPoint"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Distance -->
        <div class="grid gap-2">
          <label for="distance" class="text-sm font-medium text-gray-700">Distance (nm)</label>
          <input
            id="distance"
            type="number"
            step="0.01"
            placeholder="0.00"
            [(ngModel)]="formData.distance"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>

        <!-- Zone d'escorte -->
        <div class="grid gap-2">
          <label for="escortZone" class="text-sm font-medium text-gray-700">Zone d'escorte</label>
          <input
            id="escortZone"
            type="text"
            placeholder="Zone maritime"
            [(ngModel)]="formData.escortZone"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="col-span-2 mt-4 mb-2">
        <h3 class="text-lg font-semibold text-gray-900 border-b pb-2">Informations complémentaires</h3>
      </div>

      <!-- Incidents -->
      <div class="grid gap-2">
        <label for="incidents" class="text-sm font-medium text-gray-700">Incidents</label>
        <textarea
          id="incidents"
          placeholder="Décrire tout incident survenu"
          [(ngModel)]="formData.incidents"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="2"
        ></textarea>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations générales"
          [(ngModel)]="formData.observations"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
