<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter un navire militaire</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez un nouveau navire militaire</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro du navire -->
      <div class="grid gap-2">
        <label for="vesselNumber" class="text-sm font-medium text-gray-700">Numéro du navire *</label>
        <input
          id="vesselNumber"
          type="text"
          placeholder="Ex: NV-001"
          [(ngModel)]="formData.vesselNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['vesselNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['vesselNumber']" class="text-red-500 text-sm">{{ errors['vesselNumber'] }}</p>
      </div>

      <!-- Nom du navire -->
      <div class="grid gap-2">
        <label for="vesselName" class="text-sm font-medium text-gray-700">Nom du navire *</label>
        <input
          id="vesselName"
          type="text"
          placeholder="Ex: Patrouilleur Alpha"
          [(ngModel)]="formData.vesselName"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['vesselName'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['vesselName']" class="text-red-500 text-sm">{{ errors['vesselName'] }}</p>
      </div>

      <!-- Numéro de coque -->
      <div class="grid gap-2">
        <label for="hullNumber" class="text-sm font-medium text-gray-700">Numéro de coque</label>
        <input
          id="hullNumber"
          type="text"
          placeholder=""
          [(ngModel)]="formData.hullNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['hullNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['hullNumber']" class="text-red-500 text-sm">{{ errors['hullNumber'] }}</p>
      </div>

      <!-- Port d'attache -->
      <div class="grid gap-2">
        <label for="homePort" class="text-sm font-medium text-gray-700">Port d'attache</label>
        <input
          id="homePort"
          type="text"
          placeholder=""
          [(ngModel)]="formData.homePort"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['homePort'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['homePort']" class="text-red-500 text-sm">{{ errors['homePort'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
