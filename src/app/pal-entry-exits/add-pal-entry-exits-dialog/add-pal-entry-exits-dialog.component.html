<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une entrée/sortie PAL</h2>
          <p class="text-sm text-gray-500 mt-1">Enregistrez une nouvelle entrée/sortie PAL</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro d'entrée/sortie -->
      <div class="grid gap-2">
        <label for="entryExitNumber" class="text-sm font-medium text-gray-700">Numéro d'entrée/sortie *</label>
        <input
          id="entryExitNumber"
          type="text"
          placeholder="Ex: PAL-2024-001"
          [(ngModel)]="formData.entryExitNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['entryExitNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['entryExitNumber']" class="text-red-500 text-sm">{{ errors['entryExitNumber'] }}</p>
      </div>

      <!-- Date et heure -->
      <div class="grid gap-2">
        <label for="dateTime" class="text-sm font-medium text-gray-700">Date et heure *</label>
        <input
          id="dateTime"
          type="datetime-local"
          placeholder=""
          [(ngModel)]="formData.dateTime"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['dateTime'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['dateTime']" class="text-red-500 text-sm">{{ errors['dateTime'] }}</p>
      </div>

      <!-- Localisation PAL -->
      <div class="grid gap-2">
        <label for="palLocation" class="text-sm font-medium text-gray-700">Localisation PAL *</label>
        <input
          id="palLocation"
          type="text"
          placeholder=""
          [(ngModel)]="formData.palLocation"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['palLocation'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['palLocation']" class="text-red-500 text-sm">{{ errors['palLocation'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder=""
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
