<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <div class="relative bg-white rounded-lg shadow-lg max-w-md w-full mx-4 p-6 z-50">
    <div class="flex items-start gap-4">
      <div class="flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
          <lucide-icon [img]="AlertTriangle" [size]="24" class="text-red-600"></lucide-icon>
        </div>
      </div>

      <div class="flex-1">
        <h3 class="text-lg font-semibold text-gray-900 mb-2">
          Confirmer la suppression
        </h3>
        <p class="text-sm text-gray-500 mb-4">
          Êtes-vous sûr de vouloir supprimer cette entrée/sortie PAL ? Cette action est irréversible.
        </p>

        <div class="flex justify-end gap-3">
          <button
            (click)="handleClose()"
            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
            Annuler
          </button>
          <button
            (click)="handleConfirm()"
            class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors">
            Supprimer
          </button>
        </div>
      </div>

      <button
        (click)="handleClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors">
        <lucide-icon [img]="X" [size]="20"></lucide-icon>
      </button>
    </div>
  </div>
</div>
