<div class="max-w-7xl mx-auto p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Fonctions RH</h1>
      <p class="text-sm text-gray-500 mt-1">Gérez les fonctions rh</p>
    </div>
    <button
      (click)="openDialog()"
      class="flex items-center gap-2 px-4 py-2 bg-blue-900 text-white rounded-lg hover:bg-blue-800 transition-colors">
      <lucide-icon [img]="Plus" [size]="20"></lucide-icon>
      <span>Ajouter fonctions rh</span>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
    <div class="relative">
      <lucide-icon [img]="Search" [size]="20" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></lucide-icon>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Rechercher par nom ou description..."
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  </div>

  <!-- s Table -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div *ngIf="isLoading" class="p-8 text-center text-gray-500">
      Chargement...
    </div>

    <div *ngIf="!isLoading && filtereds.length === 0" class="p-8 text-center text-gray-500">
      Aucun hr trouvé
    </div>

    <div *ngIf="!isLoading && filtereds.length > 0" class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom du hr</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Niveau</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let hr of filtereds" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">{{ hr.hrName }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-500">
                {{ hr.hierarchyLevel !== undefined && hr.hierarchyLevel !== null ? 'Niveau ' + hr.hierarchyLevel : '-' }}
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-500">{{ hr.description || '-' }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right">
              <div class="flex items-center justify-end gap-2">
                <button
                  (click)="openDialog(hr)"
                  class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                  title="Voir les détails">
                  <lucide-icon [img]="Eye" [size]="18"></lucide-icon>
                </button>
                <button
                  (click)="openDialog(hr)"
                  class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors"
                  title="Modifier">
                  <lucide-icon [img]="Edit" [size]="18"></lucide-icon>
                </button>
                <button
                  (click)="openDialog(hr)"
                  class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                  title="Supprimer">
                  <lucide-icon [img]="Trash2" [size]="18"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Dialogs -->
<app-add-hr-dialog
  *ngIf="openDialog"
  (close)="openDialog = false"
  (add)="handleAdd($event)">
</app-add-hr-dialog>

<app-edit-hr-dialog
  *ngIf="openDialog"
  [hr]="selected"
  (close)="openDialog = false"
  (save)="handleEdit($event)">
</app-edit-hr-dialog>

<app-hr-details-dialog
  *ngIf="openDialog"
  [hr]="selected"
  (close)="openDialog = false">
</app-hr-details-dialog>

<app-delete-hr-confirmation
  *ngIf="openDialog"
  [hr]="selected"
  (close)="openDialog = false"
  (confirm)="handleDelete()">
</app-delete-hr-confirmation>
