<div class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 p-6 z-50 max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Ajouter une opération STS</h2>
          <p class="text-sm text-gray-500 mt-1">Créez une nouvelle opération STS</p>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="grid gap-4">
      <!-- Numéro d'opération -->
      <div class="grid gap-2">
        <label for="operationNumber" class="text-sm font-medium text-gray-700">Numéro d'opération *</label>
        <input
          id="operationNumber"
          type="text"
          placeholder="Ex: STS-2024-001"
          [(ngModel)]="formData.operationNumber"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['operationNumber'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['operationNumber']" class="text-red-500 text-sm">{{ errors['operationNumber'] }}</p>
      </div>

      <!-- Date et heure de début -->
      <div class="grid gap-2">
        <label for="dateTimeStart" class="text-sm font-medium text-gray-700">Date et heure de début *</label>
        <input
          id="dateTimeStart"
          type="datetime-local"
          placeholder=""
          [(ngModel)]="formData.dateTimeStart"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['dateTimeStart'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['dateTimeStart']" class="text-red-500 text-sm">{{ errors['dateTimeStart'] }}</p>
      </div>

      <!-- Date et heure de fin -->
      <div class="grid gap-2">
        <label for="dateTimeEnd" class="text-sm font-medium text-gray-700">Date et heure de fin</label>
        <input
          id="dateTimeEnd"
          type="datetime-local"
          placeholder=""
          [(ngModel)]="formData.dateTimeEnd"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['dateTimeEnd'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['dateTimeEnd']" class="text-red-500 text-sm">{{ errors['dateTimeEnd'] }}</p>
      </div>

      <!-- Localisation -->
      <div class="grid gap-2">
        <label for="location" class="text-sm font-medium text-gray-700">Localisation *</label>
        <input
          id="location"
          type="text"
          placeholder="Ex: Zone maritime XYZ"
          [(ngModel)]="formData.location"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['location'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['location']" class="text-red-500 text-sm">{{ errors['location'] }}</p>
      </div>

      <!-- Navire source -->
      <div class="grid gap-2">
        <label for="vesselFrom" class="text-sm font-medium text-gray-700">Navire source *</label>
        <input
          id="vesselFrom"
          type="text"
          placeholder=""
          [(ngModel)]="formData.vesselFrom"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['vesselFrom'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['vesselFrom']" class="text-red-500 text-sm">{{ errors['vesselFrom'] }}</p>
      </div>

      <!-- Navire destination -->
      <div class="grid gap-2">
        <label for="vesselTo" class="text-sm font-medium text-gray-700">Navire destination *</label>
        <input
          id="vesselTo"
          type="text"
          placeholder=""
          [(ngModel)]="formData.vesselTo"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['vesselTo'] ? 'border-red-500' : 'border-gray-300')"/>
        <p *ngIf="errors['vesselTo']" class="text-red-500 text-sm">{{ errors['vesselTo'] }}</p>
      </div>

      <!-- Observations -->
      <div class="grid gap-2">
        <label for="observations" class="text-sm font-medium text-gray-700">Observations</label>
        <textarea
          id="observations"
          placeholder="Observations éventuelles"
          [(ngModel)]="formData.observations"
          [class]="'w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ' + (errors['observations'] ? 'border-red-500' : 'border-gray-300')"
          rows="3"
        ></textarea>
        <p *ngIf="errors['observations']" class="text-red-500 text-sm">{{ errors['observations'] }}</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button
        (click)="handleSubmit()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        Ajouter
      </button>
    </div>
  </div>
</div>
