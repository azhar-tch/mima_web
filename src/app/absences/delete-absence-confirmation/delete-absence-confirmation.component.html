<div *ngIf="absence" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50" (click)="handleClose()"></div>

  <!-- Dialog Content -->
  <div class="relative bg-white rounded-lg shadow-lg max-w-md w-full mx-4 p-6 z-50">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Confirmer la suppression</h2>
        </div>
        <button
          (click)="handleClose()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="mb-6">
      <p class="text-gray-700">
        Êtes-vous sûr de vouloir supprimer l'absence de <strong>{{ absence.agentName }}</strong>?
      </p>
      <div class="mt-3 p-3 bg-gray-50 rounded-md">
        <p class="text-sm text-gray-600">
          <span class="font-medium">Type:</span> {{ getTypeLabel(absence.absenceType) }}
        </p>
        <p class="text-sm text-gray-600 mt-1">
          <span class="font-medium">Période:</span> {{ formatDate(absence.startDate) }} - {{ formatDate(absence.endDate) }}
        </p>
      </div>
      <p class="text-red-600 text-sm mt-3 font-medium">
        Cette action est irréversible.
      </p>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3">
      <button
        (click)="handleClose()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors"
      >
        Annuler
      </button>
      <button
        (click)="handleConfirm()"
        class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors"
      >
        Supprimer
      </button>
    </div>
  </div>
</div>
